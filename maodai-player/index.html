<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>懵呆肥猫影业 · 官方播放站</title>

  <!-- Aliyun Player -->
<link rel="stylesheet" href="https://g.alicdn.com/apsara-media-box/imp-web-player/2.27.0/skins/default/aliplayer-min.css" />
<script charset="utf-8" src="https://g.alicdn.com/apsara-media-box/imp-web-player/2.27.0/aliplayer-min.js"></script>

  <style>
    :root { --bg:#0a0a0a; --panel:#111; --panel2:#161616; --text:#fff; --muted:#aaa; --accent:#ffb300; }
    body{ margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }

    header{
      padding:18px 22px;
      background:linear-gradient(180deg,#000,#111);
      font-size:20px; font-weight:800; letter-spacing:1px;
      position:sticky; top:0; z-index:10;
      border-bottom:1px solid #111;
    }

    .container{ max-width:1100px; margin:auto; padding:22px; }

    #playerWrap{
      border-radius:14px; overflow:hidden;
      box-shadow:0 0 40px rgba(0,0,0,.8);
      background:#000;
      position:relative;
    }
    #player{ width:100%; height:62vh; min-height:280px; }

    /* 右键遮罩：降低“复制/另存为”概率（不是绝对防下载） */
    #noContextMenuMask{ position:absolute; inset:0; z-index:5; background:transparent; }

    .title{ margin-top:16px; font-size:26px; font-weight:900; }
    .desc{ margin-top:8px; color:var(--muted); line-height:1.7; }

    .bar{
      margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;
      align-items:center; justify-content:space-between;
    }
    .status{
      padding:10px 12px; border-radius:12px;
      background:var(--panel); border:1px solid #1f1f1f;
      color:#ddd; font-size:14px; line-height:1.5;
      flex:1;
      min-width:240px;
      white-space:pre-wrap; word-break:break-word;
    }
    .status.ok{ border-color:#1f3; }
    .status.bad{ border-color:#f66; color:#ffd6d6; }

    .btn{
      background:var(--panel2);
      border:1px solid #222;
      color:#eee;
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      user-select:none;
      transition:.15s;
    }
    .btn:hover{ transform:translateY(-1px); border-color:#333; }
    .btn.primary{ background:var(--accent); color:#000; border-color:#c98b00; font-weight:800; }

    .episodes{ margin-top:22px; }
    .episodes h3{ margin:0 0 10px 0; font-size:16px; color:#ddd; }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
    .ep-btn{
      background:var(--panel2);
      border:1px solid #222;
      border-radius:12px;
      padding:14px 10px;
      text-align:center;
      cursor:pointer;
      transition:.18s;
      user-select:none;
    }
    .ep-btn:hover{ background:var(--accent); color:#000; transform:scale(1.02); }
    .ep-btn.active{ outline:2px solid rgba(255,179,0,.55); }

    footer{
      margin-top:40px;
      padding:22px;
      text-align:center;
      color:#666;
      font-size:13px;
    }

    /* 尽量隐藏潜在“下载”入口（不同版本 class 可能不同） */
    .prism-download, .prism-controlbar .download,
    .prism-controlbar .prism-controlbar-download,
    .prism-controlbar .prism-controlbar-btn[title*="下载"],
    .prism-controlbar .prism-controlbar-btn[aria-label*="下载"]{
      display:none !important;
    }
  </style>
</head>

<body>
<header>懵呆肥猫影业 · 官方播放站</header>

<div class="container">
  <div id="playerWrap">
    <div id="player"></div>
    <div id="noContextMenuMask"></div>
  </div>

  <div class="title" id="mainTitle">《重生之我在投行无法无天》</div>
  <div class="desc" id="mainDesc">权力、资本、阴谋、爽点拉满。</div>

  <div class="bar">
    <div class="status" id="statusBox">准备就绪：点击“播放当前集”。</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <div class="btn" id="btnReload">重新获取凭证并播放</div>
      <div class="btn primary" id="btnPlay">播放当前集</div>
    </div>
  </div>

  <div class="episodes">
    <h3>选集播放</h3>
    <div class="grid" id="epGrid"></div>
  </div>

  <footer>© 2026 懵呆肥猫影业 | All Rights Reserved</footer>
</div>

<script>
  // =========================
  // 你的视频清单（把 VID 按集数填上）
  // 你说“这个 vid 和 auth 是第二集的”，所以我把它设为第2集
  // =========================
  const EPISODES = [
    { name: "第1集", vid: "e08007270b6d71f180786732b68f0102" },
    { name: "第2集", vid: "201b0bff0b1671f180a06723a78f0102" }, // ✅ 你给的第二集 VID
    { name: "第3集", vid: "b0a65d9c0b9271f1807b6732b68f0102" },
    { name: "第4集", vid: "填写VID4" },
  ];

  // 默认播放第2集（索引从0开始）
  let currentIndex = 0;

  let player = null;

  const statusBox = document.getElementById("statusBox");
  const epGrid = document.getElementById("epGrid");
  const btnPlay = document.getElementById("btnPlay");
  const btnReload = document.getElementById("btnReload");

  function setStatus(msg, ok=null){
    statusBox.textContent = msg;
    statusBox.classList.remove("ok","bad");
    if(ok === true) statusBox.classList.add("ok");
    if(ok === false) statusBox.classList.add("bad");
  }

  // 右键禁用（降低普通用户操作）
  document.getElementById("noContextMenuMask").addEventListener("contextmenu", (e)=> {
    e.preventDefault();
    return false;
  });

  function renderEpisodes(){
    epGrid.innerHTML = "";
    EPISODES.forEach((ep, idx)=>{
      const d = document.createElement("div");
      d.className = "ep-btn" + (idx === currentIndex ? " active" : "");
      d.textContent = ep.name;
      d.onclick = async () => {
        currentIndex = idx;
        renderEpisodes();
        await playCurrent(true);
      };
      epGrid.appendChild(d);
    });
  }

  async function getPlayAuth(vid){
    // 你需要有后端：/api/playauth?vid=xxxx
    const r = await fetch(`/api/playauth?vid=${encodeURIComponent(vid)}`, { cache: "no-store" });
    const data = await r.json().catch(()=> ({}));
    if(!r.ok) throw new Error(data?.error || "获取 PlayAuth 失败（后端 /api/playauth 未就绪）");
    if(!data.playauth) throw new Error("后端未返回 playauth");
    return data.playauth;
  }

  async function playCurrent(forceNewAuth){
    const ep = EPISODES[currentIndex];
    if(!ep.vid || ep.vid.includes("填写VID")){
      setStatus("当前集 VID 还没填。请先在 EPISODES 里把 VID 填好。", false);
      return;
    }

    try{
      setStatus(`正在获取播放凭证…\nVID=${ep.vid}`);
      const playauth = await getPlayAuth(ep.vid);

      setStatus("凭证获取成功，正在加载播放器…", true);

      if(!player){
        player = new Aliplayer({
          id: "player",
          vid: ep.vid,
          playauth,
          encryptType: 1,
          autoplay: true,
          width: "100%",
          height: "100%",
          playsinline: true,
          controlBarVisibility: "always",
          useH5Prism: true
        }, function(){
          // 保险：隐藏可能出现的“下载”按钮
          setTimeout(()=>{
            document.querySelectorAll('[title*="下载"],[aria-label*="下载"]').forEach(el=> el.style.display="none");
          }, 600);
        });
      } else {
        // 切集：用新凭证重播（避免过期）
        player.replayByVidAndPlayAuth(ep.vid, playauth);
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
      setStatus(`正在播放：${ep.name}\nVID=${ep.vid}`, true);
    } catch(err){
      setStatus(`播放失败：${String(err?.message || err)}\n\n如果你看到“后端 /api/playauth 未就绪”，说明你还没部署动态取凭证接口。`, false);
    }
  }

  btnPlay.onclick = ()=> playCurrent(true);
  btnReload.onclick = ()=> playCurrent(true);

  renderEpisodes();
  // 进入页面先自动尝试播放第2集
  playCurrent(true);
</script>
</body>
</html>
